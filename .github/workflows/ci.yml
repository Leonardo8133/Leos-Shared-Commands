name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - monolith
          - tasks
          - test-runner
          - documentation-hub
          - time-tracker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile monolith
        if: matrix.target == 'monolith'
        run: npm run -s compile

      - name: Build extracted extension
        if: matrix.target != 'monolith'
        run: npm run -s build:ext:${{ matrix.target }}

      - name: Run tests (monolith)
        if: matrix.target == 'monolith'
        run: xvfb-run -a npm test
